# cargo-deny configuration for schemreg.
#
# Run:     cargo deny check
# Install: cargo install cargo-deny --locked
#
# CI runs `cargo deny check` on every push and pull request; a failure blocks
# the merge. Add an explicit, dated, justified entry rather than relaxing a
# whole category.

[graph]
# Evaluate every optional backend, not just the default (empty) feature set —
# the AWS SDK and jsonschema trees only appear with features enabled.
all-features = true

# ── Advisories ────────────────────────────────────────────────────────────

[advisories]
# Deny all known vulnerabilities. Any exception must be listed here with a
# comment naming the advisory, the reason, and the removal condition.
ignore = []
# A yanked dependency is a supply-chain signal, not a nuisance.
yanked = "deny"

# ── Licences ──────────────────────────────────────────────────────────────

[licenses]
version = 2
confidence-threshold = 0.93
# Approved SPDX licence identifiers. Permissive only — no copyleft, so the
# crate stays embeddable in proprietary services.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # webpki-roots ships the Mozilla CA bundle under the Common Data Licence
    # Agreement (permissive; data, not code).
    "CDLA-Permissive-2.0",
    # MIT with the attribution clause removed — strictly more permissive.
    "MIT-0",
]

# ── Bans ──────────────────────────────────────────────────────────────────

[bans]
# Deny duplicate versions of the same crate to prevent accidental
# introduction of a second copy of security-critical crates (e.g. ring,
# rustls, zeroize). Re-evaluate per-package skip entries as the dependency
# tree stabilises.
multiple-versions = "deny"
# A wildcard version requirement makes the build non-reproducible.
wildcards = "deny"
allow-wildcard-paths = true
# Every entry below is a duplicate an upstream dependency forces, not one this
# crate chooses, and none of them is a second copy of anything that handles
# untrusted bytes at runtime. Recheck on each dependency bump: each should
# disappear on its own as upstream migrates.
skip = [
    # RustCrypto's digest 0.10 → 0.11 transition: aws-config's SSO cache key
    # uses sha1 0.10; apache-avro and aws-sigv4 are on sha2/hmac 0.11.
    { name = "digest", reason = "sha1 0.10 (aws-config) vs sha2/hmac 0.11 (apache-avro, aws-sigv4)" },
    { name = "block-buffer", reason = "follows digest 0.10 vs 0.11" },
    { name = "crypto-common", reason = "follows digest 0.10 vs 0.11" },
    { name = "cpufeatures", reason = "follows sha1 0.10 vs sha2 0.11" },
    # getrandom 0.2 / 0.3 / 0.4 all appear, and r-efi is its UEFI backend —
    # a target this crate is never built for.
    { name = "getrandom", reason = "platform deps on 0.2, ahash on 0.3, rand on 0.4" },
    { name = "r-efi", reason = "UEFI backend of getrandom; its lines pull different majors" },
    # Proc-macro build graph only — neither version reaches the binary.
    { name = "heck", reason = "ouroboros_macro (via apache-avro) on 0.4; strum_macros on 0.5" },
    { name = "syn", reason = "bon-macros (via apache-avro) is on syn 3; prost-derive and strum_macros are still on syn 2" },
]
deny = [
    # rustls only — openssl introduces native-library coupling, a much larger
    # attack surface, and a build-time dependency on the host toolchain.
    { name = "openssl", reason = "use rustls" },
    { name = "openssl-sys", reason = "use rustls" },
    { name = "native-tls", reason = "use rustls" },
    # One crypto provider: rustls runs on aws-lc-rs, the provider the AWS SDK
    # already links. A second provider doubles the audited surface and makes
    # rustls' process-default provider ambiguous.
    { name = "ring", reason = "aws-lc-rs is the crate's only crypto provider" },
    # The crate must never grow a second async runtime.
    { name = "async-std", reason = "schemreg targets tokio exclusively" },
]

# ── Sources ───────────────────────────────────────────────────────────────

[sources]
# Only allow crates from crates.io; reject git or path dependencies in
# published builds.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

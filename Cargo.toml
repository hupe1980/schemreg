[package]
name        = "schemreg"
version     = "0.4.0"
edition     = "2024"
rust-version = "1.88"
authors     = ["hupe1980"]
description = "Async Confluent + AWS Glue schema registry client — wire format, traits, caching, HTTP"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/hupe1980/schemreg"
documentation = "https://docs.rs/schemreg"
readme      = "README.md"
keywords    = ["kafka", "schema-registry", "confluent", "avro", "glue"]
exclude     = ["/.github", "/conformance"]
categories  = ["encoding", "network-programming", "asynchronous"]

[features]
default          = []
# Enable the built-in Confluent Schema Registry HTTP client and encoder.
# The wire codec and WireFormatDecoder are always available without it.
confluent        = [
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:zeroize",
    "dep:percent-encoding",
    "dep:base64",
]
# Enable Avro serialisation + Confluent wire-format framing via apache-avro.
# Pairs AvroSchemaEncoder / AvroSchemaDecoder with any SchemaRegistryClient.
# Does NOT require the `confluent` feature — the Confluent wire codec is
# always available and the encoder/decoder accept any SchemaRegistryClient impl.
avro             = ["dep:apache-avro", "dep:serde"]
# Enable the AWS Glue Schema Registry SDK client.
# The Glue wire-format codec (18-byte header, ZLIB) and all Glue types are
# always available without this feature. Only the AWS SDK client
# (AwsGlueSchemaRegistry) and ZLIB compression require it.
glue             = ["dep:aws-sdk-glue", "dep:aws-config", "dep:flate2"]
# Add the platform-native root certificate store to the HTTPS trust anchors,
# in addition to the bundled webpki roots. Applies to every reqwest-backed
# client (confluent and apicurio); a no-op if neither is enabled.
native-tls-roots = ["reqwest?/rustls-tls-native-roots"]
# Enable JSON Schema encode/decode + Confluent wire-format framing.
# Uses jsonschema (draft 2020-12) for schema validation and serde_json for
# serialisation. Pairs JsonSchemaEncoder / JsonSchemaDecoder with any
# SchemaRegistryClient impl. Does NOT require the `confluent` feature.
json             = ["dep:jsonschema", "dep:serde", "dep:serde_json"]
# Enable Protobuf encode/decode + Confluent wire-format framing, including
# automatic derivation of the message-index path from the message descriptor.
# Uses prost for (de)serialisation and prost-reflect for descriptor reflection.
# Does NOT require the `confluent` feature.
protobuf         = ["dep:prost", "dep:prost-reflect"]
# Enable the native Apicurio Registry v3 HTTP client.
# Uses the /apis/registry/v3/ REST API endpoints directly (group + artifact ID
# address model). Supports Avro, JSON Schema, and Protobuf artifact types.
# Does NOT require the `confluent` feature.
apicurio         = [
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:zeroize",
    "dep:percent-encoding",
    "dep:base64",
]

[dependencies]
# Async runtime
# Only `sync` (oneshot channels for in-flight coalescing) and `time` (retry
# back-off) are used by the library itself; transport runtime features come in
# via reqwest / aws-config.
tokio        = { version = "1", features = ["sync", "time"] }

# Async utilities: bounded-concurrency stream combinators used by warm_cache.
# `tokio::task::JoinSet` cannot replace this — warm_cache borrows `&self`, and
# JoinSet requires `'static` futures, which would force an Arc-clone per call.
futures      = { version = "0.3", default-features = false, features = ["alloc"] }


# Zero-copy buffers
bytes        = "1"

# Error handling
thiserror    = "2"

# Logging and tracing
tracing      = "0.1"

# Synchronization (non-poisoning RwLock)
parking_lot  = "0.12"

# avro feature
apache-avro  = { version = "0.21", default-features = false, optional = true }

# confluent + avro feature (serde is shared)
serde        = { version = "1", features = ["derive"], optional = true }
serde_json   = { version = "1", optional = true }
reqwest      = { version = "0.12", features = ["rustls-tls-webpki-roots"], default-features = false, optional = true }
zeroize      = { version = "1.8", features = ["derive"], optional = true }
percent-encoding = { version = "2.3", optional = true }
base64       = { version = "0.22", optional = true }

# glue feature
aws-config   = { version = "1", optional = true, default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-glue = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
flate2       = { version = "1", optional = true }
jsonschema = { version = "0.46.5", optional = true, default-features = false }

# protobuf feature
prost        = { version = "0.14", optional = true, default-features = false, features = ["std"] }
prost-reflect = { version = "0.16", optional = true, default-features = false }

[dev-dependencies]
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow       = "1"
wiremock = "0.6.5"
serde_json = "1"
prost-reflect = "0.16"
parking_lot = "0.12"
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "wire"
harness = false

[[example]]
name = "avro_roundtrip"
required-features = ["avro"]

[[example]]
name = "json_roundtrip"
required-features = ["json"]

[[example]]
name = "glue_roundtrip"
required-features = ["glue"]

[[example]]
name = "apicurio_roundtrip"
required-features = ["apicurio"]

[[example]]
name = "protobuf_roundtrip"
required-features = ["protobuf"]

[[example]]
name = "confluent_encode_decode"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

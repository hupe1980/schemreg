name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ── Preflight ─────────────────────────────────────────────────────────────
  #
  # The same gate CI runs, on the tagged commit — not a smaller copy of it.
  preflight:
    name: Preflight (just ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,zola@0.23.2,cargo-deny
      - run: just ci
      - run: just deny

      - name: Verify the tag, Cargo.toml and CHANGELOG agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CRATE_VERSION) != tag ($TAG_VERSION)"; exit 1
          fi
          if ! grep -q "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG_VERSION}]' section."; exit 1
          fi

      # A packaged crate can differ from the working tree: `exclude` rules,
      # missing files, a stale Cargo.lock.
      - name: Verify the packaged crate builds
        run: cargo publish --dry-run --all-features

  # ── Publish ───────────────────────────────────────────────────────────────
  #
  # crates.io Trusted Publishing: the job's OIDC identity is exchanged for a
  # short-lived token, so no long-lived registry secret is needed. Configured on
  # crates.io for repository hupe1980/schemreg, workflow release.yml,
  # environment crates-io.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: preflight
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
